name: Avalara Release Sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

# Prevent multiple concurrent runs
concurrency:
  group: avalara-automation-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_latest_release:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.find_tag.outputs.latest_tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/temporalio/temporal.git
          fi
          git fetch upstream --tags

      - name: Find latest release tag
        id: find_tag
        run: |
          # Get the latest semver tag (vX.Y.Z format, excluding pre-releases like -rc)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v '\-' | sort -V | tail -1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ ERROR: No release tags found"
            exit 1
          fi
          
          echo "📦 Latest release tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Reset main branch to latest tag
        run: |
          LATEST_TAG="${{ steps.find_tag.outputs.latest_tag }}"
          
          echo "Resetting main branch to tag $LATEST_TAG..."
          
          # Backup avalara workflow
          cp .github/workflows/avalara-release.yml /tmp/avalara-release.yml || true
          
          # Reset to the tag
          git checkout -B main "$LATEST_TAG"
          
          # Remove all workflows and actions
          rm -rf .github/workflows/*.yml .github/workflows/*.yaml .github/actions || true
          
          # Restore only avalara workflow
          mkdir -p .github/workflows
          cp /tmp/avalara-release.yml .github/workflows/avalara-release.yml
          
          git add -A .github/
          git commit -m "sync: reset main to $LATEST_TAG (avalara workflow only)" || true
          
          # Force push
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}

  verify_sync:
    runs-on: ubuntu-latest
    needs: [sync_latest_release]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Add upstream and fetch
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/temporalio/temporal.git
          fi
          git fetch upstream --tags
          git fetch origin main

      - name: Verify main matches tag (except workflows)
        run: |
          LATEST_TAG="${{ needs.sync_latest_release.outputs.latest_tag }}"
          
          echo "=== SYNC VERIFICATION ==="
          echo "Verifying main branch matches tag $LATEST_TAG"
          
          # Compare trees excluding .github
          git diff --name-only "$LATEST_TAG" origin/main -- ':!.github' > /tmp/diff.txt
          
          if [ -s /tmp/diff.txt ]; then
            echo "❌ Files differ (excluding .github):"
            cat /tmp/diff.txt
            exit 1
          else
            echo "✅ Main branch content matches $LATEST_TAG (excluding .github)"
          fi
          
          # Verify only avalara-release.yml exists in workflows
          WORKFLOW_COUNT=$(git ls-tree origin/main .github/workflows/ | wc -l)
          if [ "$WORKFLOW_COUNT" -eq 1 ]; then
            echo "✅ Only avalara-release.yml in workflows"
          else
            echo "⚠️  Found $WORKFLOW_COUNT files in .github/workflows/"
            git ls-tree origin/main .github/workflows/
          fi
          
          echo ""
          echo "🎉 Sync verified: main = $LATEST_TAG + avalara-release.yml"
