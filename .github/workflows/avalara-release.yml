name: Avalara Release Sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

# Prevent multiple concurrent runs
concurrency:
  group: avalara-automation-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need history to fast-forward
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch latest
        run: |
          # Add upstream remote if it doesn't exist
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/temporalio/temporal.git
          fi
          git fetch upstream main
          git fetch upstream --tags

      - name: Sync main branch with upstream (preserving avalara workflows)
        run: |
          # Checkout main branch
          git checkout -B main origin/main || git checkout main
          
          # Backup avalara workflow files
          cp .github/workflows/avalara-release.yml /tmp/avalara-release.yml || true
          
          # Hard reset to upstream main
          git reset --hard upstream/main

          # Remove all workflows except avalara-release.yml
          find .github/workflows -type f -name '*.yml' -o -name '*.yaml' | grep -v avalara-release | xargs rm -f || true
          
          # Remove GitHub Actions directory (custom actions from upstream)
          rm -rf .github/actions || true
          
          # Restore avalara workflow file
          cp /tmp/avalara-release.yml .github/workflows/avalara-release.yml || true
          
          git add -A .github/
          git commit -m "sync: update main branch from upstream (avalara workflows only)" || true

      - name: Push automation branch
        run: |
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}

  create_release_branches:
    runs-on: ubuntu-latest
    needs: [sync_main]
    outputs:
      latest_tag: ${{ steps.find_tag.outputs.latest_tag }}
      release_branch: ${{ steps.find_tag.outputs.release_branch }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need history to work with tags
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          # Add upstream remote if it doesn't exist
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/temporalio/temporal.git
          fi
          git fetch upstream --tags
          git fetch --all

      - name: Find latest release tag
        id: find_tag
        run: |
          # Get the latest semver tag (vX.Y.Z format, excluding pre-releases like -rc)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v '\-' | sort -V | tail -1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ ERROR: No release tags found"
            exit 1
          fi
          
          RELEASE_BRANCH="release/$LATEST_TAG"
          
          echo "📦 Latest release tag: $LATEST_TAG"
          echo "🌿 Release branch: $RELEASE_BRANCH"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Create release branch from tag
        run: |
          LATEST_TAG="${{ steps.find_tag.outputs.latest_tag }}"
          RELEASE_BRANCH="${{ steps.find_tag.outputs.release_branch }}"
          
          echo "Creating $RELEASE_BRANCH branch from tag $LATEST_TAG..."
          
          # Create or reset branch to the tag
          git checkout -B "$RELEASE_BRANCH" "$LATEST_TAG"
          
          # Force push the release branch
          echo "Force pushing $RELEASE_BRANCH to origin..."
          git push origin "$RELEASE_BRANCH" --force
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}

      - name: Create latest-release branch from release branch
        run: |
          RELEASE_BRANCH="${{ steps.find_tag.outputs.release_branch }}"
          
          echo "Creating latest-release branch from $RELEASE_BRANCH..."
          
          # Create or reset latest-release to point to the release branch
          git checkout -B "latest-release" "$RELEASE_BRANCH"
          
          # Force push latest-release
          echo "Force pushing latest-release to origin..."
          git push origin "latest-release" --force
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}

  verify_release_branches:
    runs-on: ubuntu-latest
    needs: [create_release_branches]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need history to work with branches
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch latest
        run: |
          # Add upstream remote if it doesn't exist
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/temporalio/temporal.git
          fi
          git fetch upstream --tags
          git fetch --all

      - name: Verify release branches match tag
        run: |
          LATEST_TAG="${{ needs.create_release_branches.outputs.latest_tag }}"
          RELEASE_BRANCH="${{ needs.create_release_branches.outputs.release_branch }}"
          
          echo "=== RELEASE BRANCHES VERIFICATION ==="
          echo "Verifying branches match tag $LATEST_TAG"
          echo ""
          
          # Check if branches exist
          if ! git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "❌ ERROR: $RELEASE_BRANCH branch does not exist"
            exit 1
          fi
          
          if ! git show-ref --verify --quiet "refs/remotes/origin/latest-release"; then
            echo "❌ ERROR: latest-release branch does not exist"
            exit 1
          fi
          
          # Check if tag exists
          if ! git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "❌ ERROR: tag $LATEST_TAG does not exist"
            exit 1
          fi
          
          echo "✅ All branches and tag exist"
          echo ""
          
          # Get commit SHAs
          TAG_SHA=$(git rev-parse "$LATEST_TAG^{commit}")
          RELEASE_BRANCH_SHA=$(git rev-parse "origin/$RELEASE_BRANCH")
          LATEST_RELEASE_SHA=$(git rev-parse origin/latest-release)
          
          echo "📝 Tag $LATEST_TAG commit: $TAG_SHA"
          echo "📝 $RELEASE_BRANCH commit: $RELEASE_BRANCH_SHA"
          echo "📝 latest-release commit: $LATEST_RELEASE_SHA"
          echo ""
          
          # Verify release branch matches tag
          if [ "$RELEASE_BRANCH_SHA" = "$TAG_SHA" ]; then
            echo "✅ $RELEASE_BRANCH matches tag $LATEST_TAG"
            RELEASE_MATCH=true
          else
            echo "❌ $RELEASE_BRANCH does not match tag $LATEST_TAG"
            RELEASE_MATCH=false
          fi
          
          # Verify latest-release matches release branch
          if [ "$LATEST_RELEASE_SHA" = "$RELEASE_BRANCH_SHA" ]; then
            echo "✅ latest-release matches $RELEASE_BRANCH"
            LATEST_MATCH=true
          else
            echo "❌ latest-release does not match $RELEASE_BRANCH"
            LATEST_MATCH=false
          fi
          
          # Final verdict
          echo ""
          echo "📊 VERIFICATION SUMMARY:"
          echo "  - Target tag: $LATEST_TAG"
          echo "  - Release branch ($RELEASE_BRANCH) matches tag: $RELEASE_MATCH"
          echo "  - latest-release matches release branch: $LATEST_MATCH"
          echo ""
          
          if [ "$RELEASE_MATCH" = "true" ] && [ "$LATEST_MATCH" = "true" ]; then
            echo "🎉 VERIFICATION PASSED - All branches correctly point to $LATEST_TAG!"
            exit 0
          else
            echo "❌ VERIFICATION FAILED - Branch alignment issue detected"
            exit 1
          fi
